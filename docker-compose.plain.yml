name: greenfish-webtools

services:
  greenfish-webtools:
    build: .
    container_name: greenfish-webtools
    ports:
      - "1235:1235"
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://127.0.0.1:1818/search}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1235/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
